<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <title>バージョン情報 | 鉄道路線マップ</title>
  <link rel="icon" href="jae02546b_1024_1024.png">
  <style>
    :root { color-scheme: light; --ink: #17201c; --muted: #66706b; --line: #dfe4df; --accent: #176b55; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 40px 20px; display: grid; place-items: center; color: var(--ink); background: #eef1ed; font-family: Inter, "Noto Sans JP", system-ui, sans-serif; }
    main { width: min(680px, 100%); padding: clamp(24px, 5vw, 44px); border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.97); box-shadow: 0 18px 48px rgba(27,42,35,.12); }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 34px); letter-spacing: -.04em; }
    .version { margin: 10px 0 30px; color: var(--muted); font-size: 14px; }
    h2 { margin: 28px 0 10px; font-size: 16px; }
    ul { margin: 0; padding-left: 1.3em; color: #46504b; line-height: 1.9; }
    .meta { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.8; }
    a { color: var(--accent); font-weight: 700; }
    .back { display: inline-block; margin-top: 26px; padding: 10px 14px; border-radius: 10px; background: #e4f1ec; text-decoration: none; }
    .back:hover, .back:focus-visible { background: #d6e9e1; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Railway Atlas</p>
    <h1>バージョン情報</h1>
    <p class="version">鉄道路線マップ Version 2.0.0</p>

    <h2>Version 2.0.0</h2>
    <ul>
      <li>MapLibre GL JSとOpenStreetMapによる背景地図を追加</li>
      <li>事業者・路線・駅の検索とサイドバーUIを追加</li>
      <li>地図と一覧の路線選択を連動</li>
      <li>事業者選択時の自動ズーム設定を追加</li>
      <li>日本周辺への移動範囲制限と国境線の非表示に対応</li>
    </ul>

    <p class="meta">公開日: 2026年8月14日<br>旧版: ver1.2</p>
    <a class="back" href="index.html">← 地図へ戻る</a>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f5">
  <meta property="og:title" content="鉄道路線マップ">
  <meta property="og:description" content="実際の位置関係で鉄道路線を表示">
  <meta property="og:image" content="https://jae02546.github.io/railway_map2/og.png">
  <meta property="og:url" content="https://jae02546.github.io/railway_map2/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>鉄道路線マップ</title>
  <link rel="icon" href="jae02546b_1024_1024.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <style>
    :root {
      --ink: #17201c;
      --muted: #66706b;
      --panel: rgba(255,255,255,.96);
      --line: #dfe4df;
      --accent: #176b55;
      --accent-soft: #e4f1ec;
      --route: #dc3f3f;
      --operator: #2f67c7;
      --shadow: 0 18px 48px rgba(27,42,35,.14);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--ink); background: #eef1ed; font-family: Inter, "Noto Sans JP", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { height: 100%; display: grid; grid-template-columns: 340px 1fr; }
    .sidebar { z-index: 20; min-width: 0; min-height: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); box-shadow: 4px 0 24px rgba(27,42,35,.05); }
    .brand { padding: 24px 22px 18px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .search-wrap { padding: 16px 18px 10px; }
    .search { position: relative; }
    .search::before { content: "⌕"; position: absolute; left: 14px; top: 9px; color: var(--muted); font-size: 22px; }
    #searchInput { width: 100%; height: 44px; padding: 0 36px 0 42px; border: 1px solid var(--line); border-radius: 12px; outline: 0; background: #f7f9f6; }
    #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(23,107,85,.12); background: #fff; }
    #clearSearch { position: absolute; right: 7px; top: 7px; width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--muted); }
    #clearSearch:hover { background: #e9eeea; }
    .list-head { padding: 6px 20px 10px; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
    #companyCount { font-variant-numeric: tabular-nums; }
    #railwayTree { flex: 1 1 0; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 12px 18px; scrollbar-width: thin; }
    .company { margin: 3px 0; border-radius: 12px; overflow: hidden; }
    .company-toggle, .line-button { width: 100%; border: 0; text-align: left; cursor: pointer; }
    .company-toggle { display: flex; gap: 10px; align-items: center; min-height: 45px; padding: 9px 11px; border-radius: 11px; background: transparent; font-weight: 700; }
    .company-toggle:hover { background: #f0f3ef; }
    .company.active > .company-toggle { color: var(--operator); background: #edf3ff; }
    .chevron { width: 16px; color: var(--muted); transition: transform .18s ease; }
    .company.open .chevron { transform: rotate(90deg); }
    .company-name { flex: 1; line-height: 1.35; }
    .line-count { color: var(--muted); font-size: 11px; font-weight: 500; }
    .lines { display: none; padding: 2px 5px 7px 27px; }
    .company.open .lines { display: block; }
    .line-button { min-height: 38px; padding: 8px 12px; border-radius: 9px; background: transparent; color: #46504b; }
    .line-button:hover { background: #f1f4f1; }
    .line-button.active { color: #a52222; background: #fff0ef; font-weight: 750; }
    mark { padding: 0 1px; color: inherit; background: #ffe79a; border-radius: 3px; }
    .empty { padding: 32px 12px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .selection { margin: 0 14px 14px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fafbf9; }
    .selection-label { margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
    #selectionText { min-height: 21px; font-size: 13px; font-weight: 700; line-height: 1.55; }
    #resetSelection { margin-top: 9px; padding: 7px 10px; border: 0; border-radius: 8px; color: var(--accent); background: var(--accent-soft); font-size: 12px; font-weight: 700; cursor: pointer; }
    .zoom-setting { margin-top: 12px; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); color: #46504b; font-size: 12px; font-weight: 700; cursor: pointer; }
    .zoom-setting input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .sidebar-footer { padding: 0 18px 14px; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .version-link { color: var(--muted); font-size: 11px; text-decoration: none; }
    .version-link:hover, .version-link:focus-visible { color: var(--accent); text-decoration: underline; }
    .map-shell { position: relative; min-width: 0; overflow: hidden; }
    #divSvg { position: absolute; inset: 0; background: #e9eeea; }
    .maplibregl-canvas,
    .maplibregl-canvas-container.maplibregl-interactive,
    .maplibregl-canvas-container.maplibregl-interactive:active { cursor: default !important; }
    .maplibregl-canvas { outline: none; }
    .maplibregl-ctrl-bottom-right { right: 76px; }
    .maplibregl-popup { z-index: 9; }
    .maplibregl-popup-content { padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(20,30,25,.18); color: var(--ink); font-size: 12px; font-weight: 700; line-height: 1.55; }
    .maplibregl-popup-tip { display: none; }
    .map-title { position: absolute; z-index: 5; left: 24px; top: 20px; padding: 9px 13px; border: 1px solid rgba(223,228,223,.8); border-radius: 10px; background: rgba(255,255,255,.82); box-shadow: 0 4px 16px rgba(27,42,35,.08); backdrop-filter: blur(8px); color: var(--muted); font-size: 12px; pointer-events: none; }
    .map-controls { position: absolute; z-index: 6; right: 22px; bottom: 24px; display: grid; gap: 8px; }
    .control { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.95); box-shadow: 0 5px 18px rgba(27,42,35,.12); cursor: pointer; font-size: 21px; font-weight: 500; }
    .control:hover { background: #fff; border-color: #c6cec8; transform: translateY(-1px); }
    .control.home { font-size: 16px; }
    .legend { position: absolute; z-index: 5; left: 24px; bottom: 22px; display: flex; gap: 15px; padding: 9px 12px; border: 1px solid rgba(223,228,223,.8); border-radius: 10px; background: rgba(255,255,255,.88); box-shadow: 0 4px 16px rgba(27,42,35,.07); color: var(--muted); font-size: 11px; backdrop-filter: blur(8px); }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 21px; height: 3px; border-radius: 9px; background: #8a908d; }
    .swatch.operator { background: var(--operator); }
    .swatch.route { height: 4px; background: var(--route); }
    .mobile-bar, #sidebarClose, .backdrop { display: none; }
    .loading { position: absolute; z-index: 30; inset: 0; display: grid; place-items: center; background: rgba(247,249,246,.86); transition: opacity .25s; }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading-card { padding: 18px 22px; border-radius: 14px; background: white; box-shadow: var(--shadow); font-size: 13px; font-weight: 700; }
    .tooltip-back { filter: drop-shadow(0 4px 8px rgba(20,30,25,.16)); }
    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: min(88vw, 360px); height: 100dvh; transform: translateX(-105%); transition: transform .24s ease; box-shadow: var(--shadow); }
      body.sidebar-open .sidebar { transform: translateX(0); }
      .backdrop { position: fixed; z-index: 15; inset: 0; display: block; opacity: 0; pointer-events: none; background: rgba(17,29,23,.32); transition: opacity .24s; }
      body.sidebar-open .backdrop { opacity: 1; pointer-events: auto; }
      #sidebarClose { display: block; position: absolute; right: 14px; top: 14px; width: 38px; height: 38px; border: 0; border-radius: 10px; background: #eef2ee; cursor: pointer; font-size: 19px; }
      .map-shell { height: 100%; }
      .mobile-bar { position: absolute; z-index: 8; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; }
      #sidebarOpen { height: 44px; padding: 0 15px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.96); box-shadow: 0 5px 18px rgba(27,42,35,.12); font-weight: 750; }
      #mobileSelection { min-width: 0; max-width: calc(100vw - 110px); padding: 10px 12px; overflow: hidden; border-radius: 11px; background: rgba(255,255,255,.9); box-shadow: 0 4px 15px rgba(27,42,35,.08); color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .map-title { display: none; }
      .legend { left: 12px; bottom: max(14px, env(safe-area-inset-bottom)); gap: 9px; }
      .legend span:first-child { display: none; }
      .map-controls { right: 12px; bottom: max(70px, calc(env(safe-area-inset-bottom) + 66px)); }
      .maplibregl-ctrl-bottom-right { right: 58px; bottom: 2px; }
      .brand { padding-top: 23px; padding-right: 60px; }
    }
  </style>
</head>
<body onload="main()">
  <div class="app">
    <aside class="sidebar" aria-label="鉄道事業者と路線">
      <button id="sidebarClose" aria-label="メニューを閉じる">×</button>
      <header class="brand">
        <h1>鉄道路線マップ</h1>
        <p class="subtitle">実際の位置関係で鉄道路線を表示</p>
      </header>
      <div class="search-wrap">
        <div class="search">
          <input id="searchInput" type="search" placeholder="事業者・路線・駅を検索" autocomplete="off" aria-label="事業者、路線、駅を検索">
          <button id="clearSearch" aria-label="検索を消去">×</button>
        </div>
      </div>
      <div class="list-head"><span>事業者・路線</span><span id="companyCount"></span></div>
      <nav id="railwayTree" aria-live="polite"></nav>
      <section class="selection" aria-live="polite">
        <div class="selection-label">SELECTED</div>
        <div id="selectionText">全国の路線</div>
        <button id="resetSelection">選択を解除して全国表示</button>
        <label class="zoom-setting" for="companyAutoZoom">
          <span>事業者選択時に自動ズーム</span>
          <input id="companyAutoZoom" type="checkbox" checked>
        </label>
      </section>
      <footer class="sidebar-footer"><span>ver2.0.0 (c)2023-2026 jae02546</span><a class="version-link" href="readme.html" target="_blank" rel="noopener noreferrer">README</a></footer>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <main class="map-shell">
      <div class="mobile-bar"><button id="sidebarOpen">☰ 路線を探す</button><div id="mobileSelection">全国の路線</div></div>
      <div class="map-title">ドラッグで移動・ホイールで拡大縮小</div>
      <div id="divSvg" role="application" aria-label="日本全国の鉄道路線地図"></div>
      <div class="legend" aria-label="凡例"><span><i class="swatch"></i>その他</span><span><i class="swatch operator"></i>事業者</span><span><i class="swatch route"></i>選択路線</span></div>
      <div class="map-controls" aria-label="地図操作">
        <button class="control" id="zoomIn" aria-label="拡大">＋</button>
        <button class="control" id="zoomOut" aria-label="縮小">−</button>
        <button class="control home" id="homeView" aria-label="全国表示">⌂</button>
      </div>
      <div class="loading" id="loading"><div class="loading-card">鉄道データを読み込んでいます…</div></div>
    </main>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="railwayMap.js"></script>
</body>
</html>
